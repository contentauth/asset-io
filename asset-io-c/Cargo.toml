[workspace]

[package]
name = "asset-io-c"
version = "0.3.2"
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "Application-facing C bindings for asset-io (not a handler plugin ABI)"
build = "build.rs"

[lib]
name = "asset_io_c"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
asset-io = { path = "..", version = "0.3.2", default-features = false }
cimpl = "=0.4.1"
serde_json = "1"

[build-dependencies]
cbindgen = "=0.29.2"

[features]
default = ["jpeg", "png"]
jpeg = ["asset-io/jpeg"]
png = ["asset-io/png"]
bmff = ["asset-io/bmff"]
riff = ["asset-io/riff"]
svg = ["asset-io/svg"]
pdf = ["asset-io/pdf"]
tiff = ["asset-io/tiff"]
c2pa = ["asset-io/c2pa"]
gif = ["asset-io/gif"]
id3 = ["asset-io/id3"]
all-formats = ["jpeg", "png", "bmff", "riff", "svg", "pdf", "tiff", "c2pa", "gif", "id3"]
exif = ["asset-io/exif"]
xmp = ["asset-io/xmp"]
memory-mapped = ["asset-io/memory-mapped"]
flate = ["asset-io/flate"]
brotli = ["asset-io/brotli"]
