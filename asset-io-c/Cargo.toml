[package]
name = "asset-io-c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Application-facing C bindings for asset-io (not a handler plugin ABI)"
# Distributed as C libraries built from this repository, not through crates.io.
publish = false
build = "build.rs"

[lib]
name = "asset_io_c"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
asset-io.workspace = true
cimpl = "=0.4.1"
serde_json = "1"

[build-dependencies]
cbindgen = "=0.29.2"

# Like asset-io, no container handlers are enabled by default.
[features]
default = []
jpeg = ["asset-io/jpeg"]
png = ["asset-io/png"]
bmff = ["asset-io/bmff"]
riff = ["asset-io/riff"]
svg = ["asset-io/svg"]
pdf = ["asset-io/pdf"]
tiff = ["asset-io/tiff"]
c2pa = ["asset-io/c2pa"]
gif = ["asset-io/gif"]
id3 = ["asset-io/id3"]
all-formats = ["jpeg", "png", "bmff", "riff", "svg", "pdf", "tiff", "c2pa", "gif", "id3"]
exif = ["asset-io/exif"]
xmp = ["asset-io/xmp"]
memory-mapped = ["asset-io/memory-mapped"]
flate = ["asset-io/flate"]
brotli = ["asset-io/brotli"]
