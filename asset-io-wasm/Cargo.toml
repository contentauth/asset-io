[workspace]

[package]
name = "asset-io-wasm"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Sans-I/O parsing proof for host-native JavaScript async I/O"
repository = "https://github.com/contentauth/asset-io"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
asset-io = { path = "..", version = "0.2.0", default-features = false }
serde_json = "1"
wasm-bindgen = "0.2"

[features]
default = ["jpeg", "png"]
jpeg = ["asset-io/jpeg"]
png = ["asset-io/png"]
bmff = ["asset-io/bmff"]
riff = ["asset-io/riff"]
svg = ["asset-io/svg"]
pdf = ["asset-io/pdf"]
tiff = ["asset-io/tiff"]
c2pa = ["asset-io/c2pa"]
all-formats = ["jpeg", "png", "bmff", "riff", "svg", "pdf", "tiff", "c2pa"]
