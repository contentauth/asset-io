name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustfmt.toml follows c2pa-rs and uses options only nightly rustfmt has.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: |
          for manifest in Cargo.toml fuzz/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" --all -- --check
          done

  ci:
    name: Clippy / Docs / Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy (all features)
        run: |
          cargo clippy --all-features --all-targets -- -D warnings
          cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Tests without handlers
        run: |
          cargo test --locked --no-default-features

#      - name: Test each handler independently
#       run: |
#          for handler in jpeg png bmff riff svg pdf tiff c2pa; do
#            cargo test --locked --no-default-features --features "$handler"
#          done

      - name: Tests (all features)
        run: cargo test --locked --all-features

  c-bindings:
    name: C bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Lint
        run: |
          cargo clippy --locked -p asset-io-c --all-features --all-targets -- -D warnings

      - name: Test minimal and full bindings
        run: |
          cargo test --locked -p asset-io-c
          cargo test --locked -p asset-io-c --all-features

      - name: Compile and run C and C++ consumers
        run: |
          cargo build --locked -p asset-io-c --all-features --target-dir asset-io-c/target
          cc -std=c11 -Wall -Wextra -Werror -Iasset-io-c/include asset-io-c/examples/smoke.c \
            -Lasset-io-c/target/debug -lasset_io_c -Wl,-rpath,"$PWD/asset-io-c/target/debug" -o asset-io-c/target/c-smoke
          asset-io-c/target/c-smoke
          c++ -x c++ -std=c++17 -Wall -Wextra -Werror -Iasset-io-c/include asset-io-c/examples/smoke.c \
            -Lasset-io-c/target/debug -lasset_io_c -Wl,-rpath,"$PWD/asset-io-c/target/debug" -o asset-io-c/target/cpp-smoke
          asset-io-c/target/cpp-smoke
