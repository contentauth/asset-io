name: Release PR

# Opens or updates the release PR: the next version and its CHANGELOG.md entry.
# Publishing is done separately by the Release workflow (release.yml).
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-pr:
    name: Update release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # One run at a time, so concurrent pushes don't race on the PR branch.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
