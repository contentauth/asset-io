[package]
name = "asset-io"
version = "0.3.1"
edition = "2021"
authors = ["Gavin Peacock <gpeacock@adobe.com>"]
license = "MIT OR Apache-2.0"
description = "Streaming, container-agnostic access to media file structure and metadata (JUMBF, XMP)"
repository = "https://github.com/contentauth/asset-io"
keywords = ["asset", "c2pa", "xmp", "jumbf", "metadata"]
categories = ["multimedia", "parsing"]
exclude = ["tests/", "fuzz/", "fuzz.sh", "FUZZING_SETUP.md", "Makefile", "asset-io-c/", ".github/", ".vscode/"]
rust-version = "1.88"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
thiserror = "1.0"
# Container dependencies, enabled by the container features below.
md5 = { version = "0.7", optional = true }
memchr = { version = "2", optional = true }
quick-xml = { version = "0.41", optional = true, default-features = false }
# Optional decoders and I/O.
flate2 = { version = "1", optional = true, default-features = false, features = ["rust_backend"] }
brotli-decompressor = { version = "5", optional = true, default-features = false, features = ["std"] }
memmap2 = { version = "0.9", optional = true }
tokio = { version = "1", features = ["io-util"], optional = true }

[dev-dependencies]
sha2 = "0.11"
tempfile = "3"
criterion = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }

[features]
default = []
# Containers: each enables a module under `containers` and its handler in
# `HandlerRegistry::builtin`.
jpeg = ["dep:md5", "dep:memchr"]
png = []
bmff = []
riff = []
svg = ["dep:quick-xml"]
pdf = ["flate"]
tiff = []
c2pa = []
all-formats = ["jpeg", "png", "bmff", "riff", "svg", "pdf", "tiff", "c2pa"]
# Transfer-encoding decoders: zlib, raw deflate and gzip; Brotli.
flate = ["dep:flate2"]
brotli = ["dep:brotli-decompressor"]
exif = []
xmp = ["dep:quick-xml"]
memory-mapped = ["dep:memmap2"]
tokio = ["dep:tokio"]

[[example]]
name = "inspect"
required-features = ["all-formats", "exif"]

[[example]]
name = "tokio_client"
required-features = ["all-formats", "tokio"]

[[bench]]
name = "io"
harness = false
required-features = ["all-formats"]

[[bench]]
name = "pdf"
harness = false
required-features = ["pdf"]

[profile.bench]
inherits = "release"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
